[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organotchi"
version = "0.1.0"
description = "Automated segmentation, morphological characterization, and longitudinal tracking of organoids from brightfield images."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "pillow==12.2.0",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "opencv-python-headless==4.10.0.84",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
    "questionary==2.1.1",
    "umap-learn==0.5.12",
]

# The deep-learning stack (SegFormer checkpoint inference via mmsegmentation)
# is optional -- every module that needs torch/mmengine/mmseg soft-imports it
# (try/except ModuleNotFoundError) so classical-segmentation and
# morphology-analysis workflows install and run without it. Needs Python
# 3.10 specifically: torch==2.1.0/mmcv==2.1.0 (the pins verified compatible
# with each other and with the `MS2D` mmseg dataset class this tool's own
# checkpoints were trained with) have no prebuilt wheels for Python 3.12+ --
# see requirements.txt's own header note for the full version-compatibility
# story.
#
# "orgline" is a separate extra, not part of "dl": OrgLine (the `orgline`
# segmentation method) needs torch/torchvision too, but not
# mmengine/mmcv/mmdet, plus its own additional dependencies -- see
# environments/README.md for the full setup (cloning OrgLine itself,
# downloading its checkpoints). Install both extras together
# (`pip install -e ".[dl,orgline]"`) to use every segmentation method.
[project.optional-dependencies]
dl = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "mmengine==0.10.7",
    "mmcv==2.1.0",
    "mmdet==3.3.0",
]
orgline = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "einops==0.8.2",
    "timm==1.0.28",
    "albumentations==2.0.8",
    "hydra-core==1.3.5",
    "omegaconf==2.3.1",
    "pycocotools==2.0.11",
    "tifffile==2025.5.10",
    "roifile==2025.12.12",
    "gdown==6.1.0",
    "py-cpuinfo==9.0.0",
]

# segmentation.py --correct_mask (interactive, napari-based manual mask
# correction -- see utils_segmentation.py's open_mask_correction_viewer)
# needs a real Qt backend and a real display, neither of which any other
# part of this pipeline needs -- soft-imported the same way as the dl stack
# above, so every other workflow installs and runs without it.
correct_mask = [
    "napari[pyqt5]",
]

[tool.setuptools]
packages = ["data_analysis"]

[tool.setuptools.package-data]
data_analysis = ["*.json", "templates/*"]
